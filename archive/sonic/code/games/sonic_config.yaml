env_cls: SonicCore
module: code.games.sonic_core
screen_width: 800
screen_height: 600
fps: 60
tile_size: 32
max_steps: 10000
observation_space:
  type: Dict
  spaces:
    grids:
      type: Box
      shape: [4, 21, 21]
      low: -1.0
      high: 1.0
    scalars:
      type: Box
      shape: [20]
      low: -.inf
      high: .inf
action_space:
  type: Discrete
  n: 10
episode:
  max_steps: 10000
defaults:
  player:
    lives: 3
    dimensions:
      width: 24
      height: 32
    movement:
      max_run_speed: 380.0
      run_accel: 600.0
      max_walk_speed: 180.0
      walk_accel: 480.0
      air_control: 0.40
    jump:
      min_velocity: -520.0
      max_velocity: -700.0
      hold_frames: 20
      coyote_frames: 6
      buffer_frames: 8
  physics:
    gravity: 1100.0
    fast_fall_gravity: 2000.0
    friction:
      ground: 600.0
      air: 100.0
levels:
  Green Hill 1:
    file: sonic/green_hill_1.txt
    time_limit: 300
    background_color: [0, 128, 255]
  Green Hill 2:
    file: sonic/green_hill_2.txt
    time_limit: 300
    background_color: [0, 128, 255]
