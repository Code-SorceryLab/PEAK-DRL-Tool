# Bomberman clone — NES/SNES-style single-screen arena, 15x13 tiles.
tile_size: 32
fps: 60
time_limit: 200            # seconds on the stage clock
player:
  size: 24                 # hitbox, px (smaller than a tile so corners can be cut)
  walk_speed: 112          # px/s (3.5 tiles/s)
  sprint_speed: 168        # speedrunner persona / speed power-up
  corner_cut: 10           # px of slide toward an open lane when pushing against a pillar
  bombs: 1                 # starting bomb count
  range: 1                 # starting blast range (tiles per arm)
bomb:
  fuse_frames: 150         # 2.5 s
  blast_frames: 30         # how long the flames stay lethal
  danger_lookahead: 30     # frames: hazard channel marks cells that explode within this window
enemies:                   # speed in px/s; chase = probability per tile of turning toward the player
  E: {name: Ballom, speed: 48,  passes_bricks: false, chase: 0.0}
  k: {name: Onil,   speed: 72,  passes_bricks: false, chase: 0.5}
  K: {name: Pass,   speed: 112, passes_bricks: false, chase: 0.9}
  M: {name: Doria,  speed: 40,  passes_bricks: true,  chase: 0.3}
  B: {name: Ovape,  speed: 64,  passes_bricks: true,  chase: 0.2}
scoring:
  brick: 10
  enemy: {E: 100, k: 200, K: 400, M: 1000, B: 2000}
levels:                    # index = level id (menu / --level N); paths relative to levels/
  - bomberman/01_open_floor.txt
  - bomberman/02_one_wall.txt
  - bomberman/03_corridor.txt
  - bomberman/04_brick_maze.txt
  - bomberman/05_hidden_exit.txt
  - bomberman/06_chasers.txt
  - bomberman/07_brick_walkers.txt
  - bomberman/08_gauntlet.txt
