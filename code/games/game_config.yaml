game:
  title: PEAK Platformer
  screen_width: 800
  screen_height: 600
  fps: 60
  render_mode: human
env_cls: PlatformerCore
module: code.games.platformer_core
max_steps: 10000
observation_space:
  type: Box
  shape:
  - 36
  low: -500.0
  high: 500.0
action_space:
  type: Discrete
  n: 8
reward:
  type: progress_flag
  shaping:
    step: 0.01
    goal: 1.0
    fall: -1.0
episode:
  max_steps: 1000
init:
  seed: 42
  level: easy
persona: null
metrics:
- episode_reward
- episode_length
render:
  window_size:
  - 640
  - 480
  show_fps: false
  debug_overlay: false
logging:
  tensorboard: true
defaults:
  player:
    lives: 3
    dimensions:
      width: 20
      height: 32
levels:
  Demo Lvl:
    file: stage_1.txt
    time_limit: 300
    background_color:
    - 0
    - 0
    - 0
  Demo lvl 2:
    file: stage_3.txt
    time_limit: 300
    background_color:
    - 0
    - 0
    - 0
  Demo Spike level:
    file: stage_4.txt
    time_limit: 300
    background_color:
    - 0
    - 0
    - 0
  Path-Finding:
    file: stage_12.txt
    time_limit: 300
    background_color:
    - 0
    - 0
    - 0
  Path Finding 2:
    file: stage_7.txt
    time_limit: 300
    background_color:
    - 0
    - 0
    - 0
  Moving Platforms Demo:
    file: platform.txt
    time_limit: 300
    background_color:
    - 0
    - 0
    - 0
