# ==========================================
# GLOBAL GAME SETTINGS
# ==========================================
game:
  title: "PEAK Platformer"
  screen_width: 800
  screen_height: 600
  fps: 60
  render_mode: "human"

# ==========================================
# DEFAULTS (Layer 2)
# ==========================================
defaults:
  physics:
    # gravity: 950.0          #
    friction:
      # ground: 500.0
      # air: 250.0

  player:
    lives: 3
    dimensions: {width: 20, height: 32} #
    movement:
      # walk_accel: 1000.0     #
      # max_run_speed: 340.0   #
    jump:
      # max_velocity: -600.0   #

# ==========================================
# LEVELS (Layer 1)
# ==========================================
levels:
  "1-1":
    file: "stage_1.txt"
    time_limit: 400
    background_color: [107, 140, 255]
    
    # PLAYER SPAWN POINT (World Space Coords)
    # spawn: 
    #   x: 800.0
    #   y: 350.0

    dynamics:
      enemies:
        - type: "Enemy"
          x: 832
          y: 416
          vx: -60.0

  "1-2":
    file: "stage_2.txt"
    time_limit: 300
    background_color: [0, 0, 0]
    
    # Different spawn for level 1-2
    spawn:
      x: 50.0
      y: 500.0

    physics:
      gravity: 500.0
    
    dynamics:
      enemies:
