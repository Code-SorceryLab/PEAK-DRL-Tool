env_cls: PlatformerCore
module: code.games.platformer_core
max_steps: 10000
observation_space:
  type: Dict
  spaces:
    grids:
      type: Box
      shape:
      - 4
      - 21
      - 21
      low: -1.0
      high: 1.0
    scalars:
      type: Box
      shape:
      - 20
      low: -.inf
      high: .inf
action_space:
  type: MultiDiscrete
  nvec:
  - 5
  - 2
  - 2
reward:
  type: progress_flag
  shaping:
    step: 0.01
    goal: 1.0
    fall: -1.0
episode:
  max_steps: 10000
init:
  seed: 42
  level: easy
persona: null
metrics:
- episode_reward
- episode_length
render:
  window_size:
  - 640
  - 480
  show_fps: false
  debug_overlay: false
logging:
  tensorboard: true
defaults:
  player:
    lives: 3
    dimensions:
      width: 20
      height: 32
levels:
  Mario1-1:
    file: world1_1.txt
    time_limit: 300
    background_color:
    - 0
    - 0
    - 0
  Mario1-2:
    file: world1_2.txt
    time_limit: 300
    background_color:
    - 0
    - 0
    - 0
megaman:
  env_cls: MegaManCore
  module: code.games.megaman_core
  screen_width: 960
  screen_height: 600
  fps: 60
  tile_size: 32
  physics:
    walk_speed: 240.0
    run_speed: 320.0
    accel: 2800.0
    friction: 2600.0
    jump_velocity: -560.0
    gravity: 1500.0
    max_fall_speed: 900.0
    climb_speed: 190.0
    bullet_speed: 760.0
    shot_cooldown: 0.16
    max_player_shots: 3
    i_frame_duration: 0.75
    hp_max: 28
    enemies:
      gravity_mult: 1.0
      max_fall_speed: 760.0
      bullet_speed: 420.0
  action_space:
    type: MultiDiscrete
    nvec:
    - 5
    - 3
    - 2
    - 2
  observation_space:
    type: Dict
    spaces:
      grids:
        type: Box
        shape:
        - 4
        - 21
        - 21
        low: 0.0
        high: 1.0
      scalars:
        type: Box
        shape:
        - 24
        low: -1.0
        high: 1.0
  reward:
    shaping:
      step: -0.01
      goal: 10.0
      fall: -5.0
      enemy_kill: 0.5
      damage_taken: -1.0
  episode:
    max_steps: 10000
  render:
    show_fps: true
    debug_overlay: false
    hud_color:
    - 80
    - 208
    - 255
  defaults:
    player:
      lives: 3
      dimensions:
        width: 20
        height: 28
  levels:
    MM-Train4:
