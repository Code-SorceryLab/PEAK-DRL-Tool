game:
  title: PEAK Platformer
  screen_width: 800
  screen_height: 600
  fps: 60
  render_mode: human
env_cls: PlatformerCore
module: code.games.platformer_core
max_steps: 10000
observation_space:
  type: Box
  shape:
  - 36
  low: -500.0
  high: 500.0
action_space:
  type: Discrete
  n: 8
reward:
  type: progress_flag
  shaping:
    step: 0.01
    goal: 1.0
    fall: -1.0
episode:
  max_steps: 1000
init:
  seed: 42
  level: easy
persona: null
metrics:
- episode_reward
- episode_length
render:
  window_size:
  - 640
  - 480
  show_fps: false
  debug_overlay: false
logging:
  tensorboard: true
defaults:
  physics:
    gravity: 1300
    fast_fall_gravity: 2500
    friction:
      ground: 1300
      air: 250
    max_fall_speed: 550
    max_run_speed: 150
  player:
    lives: 3
    dimensions:
      width: 20
      height: 32
    movement:
      walk_accel: 1000.0
      max_run_speed: 340.0
    jump:
      max_velocity: -600.0
levels:
