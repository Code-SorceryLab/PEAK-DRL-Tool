env_cls: PlatformerCore
module: code.games.platformer_core
max_steps: 10000
observation_space:
  type: Dict
  spaces:
    grids:
      type: Box
      shape:
      - 4
      - 21
      - 21
      low: -1.0
      high: 1.0
    scalars:
      type: Box
      shape:
      - 20
      low: -.inf
      high: .inf
action_space:
  type: MultiDiscrete
  nvec:
  - 5
  - 2
  - 2
reward:
  type: progress_flag
  shaping:
    step: 0.01
    goal: 1.0
    fall: -1.0
episode:
  max_steps: 10000
init:
  seed: 42
  level: easy
persona: null
metrics:
- episode_reward
- episode_length
render:
  window_size:
  - 640
  - 480
  show_fps: false
  debug_overlay: false
logging:
  tensorboard: true
defaults:
  player:
    lives: 3
    dimensions:
      width: 20
      height: 32
levels:                    # every level is an AST level: 1-1 holds the hand-placed mutants, 1-2 to 1-4 placed ones
  Mario1-1:
    file: platformer/world1_1.txt
    time_limit: 300
    background_color:
    - 0
    - 0
    - 0
  Mario1-2:
    file: platformer/world1_2.txt
    time_limit: 300
    background_color:
    - 0
    - 0
    - 0
  Mario1-3:
    file: platformer/world1_3.txt
    time_limit: 300
    background_color:
    - 135
    - 206
    - 235
  Mario1-4:
    file: platformer/world1_4.txt
    time_limit: 300
    background_color:
    - 0
    - 0
    - 0
disabled_levels:
  Mario1-2c:
    file: platformer/world1_2_s3.txt
    time_limit: 120
    background_color:
    - 0
    - 0
    - 0
  Mario1-2b:
    file: platformer/world1_2_s2.txt
    time_limit: 120
    background_color:
    - 0
    - 0
    - 0
  Mario1-2a:
    file: platformer/world1_2_s1.txt
    time_limit: 120
    background_color:
    - 0
    - 0
    - 0
  Mario1-1c:
    file: platformer/world1_1_s3.txt
    time_limit: 120
    background_color:
    - 0
    - 0
    - 0
  Mario1-1a:
    file: platformer/world1_1_s1.txt
    time_limit: 120
    background_color:
    - 0
    - 0
    - 0
  Mario1-1b:
    file: platformer/world1_1_s2.txt
    time_limit: 120
