# SPEEDY: the first zone of the 1991 Mega Drive platformer, on this engine.
# Physics live in speedy_core.py in the original's units; there is nothing to tune here but the training set-up.
levels:
  green_hill_1: {act: 1}
  green_hill_2: {act: 2}
  green_hill_3: {act: 3}
physics:
  jump: 1664             # 0x680: 6.5 px per frame in 1/256 px
training:
  stall_frames: 900      # end an attempt after this long with no new rightmost point (15 s)
  max_frames: 10800      # 3 minutes: a careful clear of an act fits; the 60 s default does not
  jump_period: 8         # frames a held jump output stays down on the ground before it lets go for one
