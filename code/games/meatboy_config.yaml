# Super Meat Boy (Team Meat, 2010) as PEAK plays it. Every value, its source and what it was before:
# docs/MEATBOY_SMB_RESEARCH.md. Scale: one Meat Boy height (u) = 0.7 tile = 22.4 px; fixed 60 Hz step.
tile_size: 32
player:
  width: 22                # a cube about 0.7 tile tall
  height: 22
physics:
  gravity: 918.0           # 41 u/s^2 (DiGRA 2016)
  max_fall_speed: 500.0    # none seen within a full jump (DiGRA); about 20 u/s in 1-13 (Kevin)
movement:
  walk_accel: 784.0        # 35 u/s^2, top speed in 0.52 s (DiGRA)
  max_walk_speed: 403.0    # 18 u/s (DiGRA)
  run_accel: 1500.0        # 0 -> 600 px/s in 0.4 s (Kevin, 1-13 walkthrough)
  max_run_speed: 600.0     # about 27 u/s, what the 1-3 record of 1.37 s needs (estimate)
  turn_factor: 2.0         # acceleration doubles against the motion: 70 vs 35 u/s^2 (DiGRA)
jump:
  jump_vel: 470.0          # 21 u/s at any speed (DiGRA)
  min_hold_frames: 8       # a tap rises 2.2 u as DiGRA measured (their "0.1 s hold"); let go after that, the climb stops
wall:
  slide_max_speed: 180.0   # 8 u/s (estimate: no source gives it)
  stick_frames: 12         # 200 ms on the wall after pulling away (Refenes)
  wall_jump_vy: 500.0      # about 22 u/s up (Kevin, 1-13)
  wall_jump_push: 500.0    # about 22 u/s away (Kevin, 1-13)
crumble_seconds: 0.75      # "slightly longer" than the Flash game's half second (wiki; estimate)
levels:
  - meatboy/world1_01_hello_world.txt
  - meatboy/world1_02_upward.txt
  - meatboy/world1_03_the_gap.txt
  - meatboy/world1_04_nutshell.txt
  - meatboy/world1_05_holy_mountain.txt
  - meatboy/world1_06_bladecatcher.txt
  - meatboy/world1_07_diverge.txt
  - meatboy/world1_08_the_bit.txt
  - meatboy/world1_09_safety_third.txt
  - meatboy/world1_10_the_levee.txt
  - meatboy/world1_11_fired.txt
max_steps: 4000
