# Super Meat Boy character — monolithic loadout (the "old way").
# Physics tuned to the SkarnKain Super-Meat-Boy-JS-Remake reference
# (50 fps, 30 px blocks, forces applied twice per frame), converted to
# px/s at 32 px tiles: floaty-but-fast classic SMB feel, ~3.4-tile max jump,
# very fast sprint, damped wall-slide fall.
tile_size: 32
player:
  width: 18
  height: 26
physics:
  gravity: 1060.0          # JS: 0.2*2 px/f^2 @50fps -> ~1067 px/s^2
  fast_fall_grav: 1060.0   # JS has no fast-fall distinction
  max_fall_speed: 450.0    # Super Meat Boy falls ~20 body-lengths/s (walkthrough, 1-13); was 1400
movement:
  walk_accel: 810.0        # same 0.54 ratio to run_accel as before; was 2600
  run_accel: 1500.0        # 0 -> 600 px/s in 0.4 s, as Super Meat Boy (walkthrough 1-13, 206.98-207.38 s); was 4800
  max_walk_speed: 300.0
  max_run_speed: 600.0     # JS sustained ~10.2 px/f (~544); cap 13 (~693)
  air_control: 1.0         # JS air accel == ground accel
  ground_friction: 3600.0
  air_friction: 300.0
  skid_decel: 7000.0
jump:
  jump_vel: 480.0          # JS max impulse 0.9*2*5 = 9 px/f -> ~480 px/s
  cut_vel: 150.0
  coyote_frames: 6
  buffer_frames: 6
  max_jumps: 1
wall:
  slide_max_speed: 280.0   # JS slide terminal ~5.3 px/f -> ~283 px/s
  wall_jump_vy: 500.0      # ~22 body-lengths/s up off a wall in Super Meat Boy (1-13); was 580
  wall_jump_push: 500.0    # ~18-23 body-lengths/s away from the wall in Super Meat Boy; was 620
  wall_jump_push_away: 645.0  # holding away: the same 1.3x the plain push as before; was 800
  control_lockout_frames: 6
levels:
  - meatboy/world1_01_hello_world.txt
  - meatboy/world1_02_upward.txt
  - meatboy/world1_03_the_gap.txt
  - meatboy/world1_04_nutshell.txt
  - meatboy/world1_05_holy_mountain.txt
  - meatboy/world1_06_bladecatcher.txt
  - meatboy/world1_07_diverge.txt
  - meatboy/world1_08_the_bit.txt
  - meatboy/world1_09_safety_third.txt
  - meatboy/world1_10_the_levee.txt
  - meatboy/world1_11_salt_factory.txt
max_steps: 4000
