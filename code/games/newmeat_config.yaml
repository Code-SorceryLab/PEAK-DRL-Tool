# newMeat: World 1 levels 1-1 .. 1-15, rebuilt on the real game's layouts.
# Same physics loadout as meatboy_config.yaml; only the level list differs.
# Physics tuned to the SkarnKain Super-Meat-Boy-JS-Remake reference
# (50 fps, 30 px blocks, forces applied twice per frame), converted to
# px/s at 32 px tiles: floaty-but-fast classic SMB feel, ~3.4-tile max jump,
# very fast sprint, damped wall-slide fall.
tile_size: 32
player:
  width: 18
  height: 26
physics:
  gravity: 1060.0          # JS: 0.2*2 px/f^2 @50fps -> ~1067 px/s^2
  fast_fall_grav: 1060.0   # JS has no fast-fall distinction
  max_fall_speed: 1400.0
movement:
  walk_accel: 2600.0
  run_accel: 4800.0        # JS: 0.9*2 px/f^2 -> ~4800 px/s^2
  max_walk_speed: 300.0
  max_run_speed: 600.0     # JS sustained ~10.2 px/f (~544); cap 13 (~693)
  air_control: 1.0         # JS air accel == ground accel
  ground_friction: 3600.0
  air_friction: 300.0
  skid_decel: 7000.0
jump:
  jump_vel: 480.0          # JS max impulse 0.9*2*5 = 9 px/f -> ~480 px/s
  cut_vel: 150.0
  coyote_frames: 6
  buffer_frames: 6
  max_jumps: 1
wall:
  slide_max_speed: 280.0   # JS slide terminal ~5.3 px/f -> ~283 px/s
  wall_jump_vy: 580.0      # JS: 1.1*2*5 = 11 px/f -> ~587 px/s
  wall_jump_push: 620.0    # JS: 1.2*2*5 = 12 px/f -> ~640 px/s
  wall_jump_push_away: 800.0  # JS long jump: 1.5*2*5 = 15 px/f when holding away
  control_lockout_frames: 6
levels:
  - newMeat/1_01_hello_world.txt
  - newMeat/1_02_upward.txt
  - newMeat/1_03_the_gap.txt
  - newMeat/1_04_nutshell.txt
  - newMeat/1_05_holy_mountain.txt
  - newMeat/1_06_blood_mountain.txt
  - newMeat/1_07_diverge.txt
  - newMeat/1_08_the_bit.txt
  - newMeat/1_09_safety_third.txt
  - newMeat/1_10_the_levee.txt
  - newMeat/1_11_salt_factory.txt
  - newMeat/1_12_rise.txt
  - newMeat/1_13_lightfoot.txt
  - newMeat/1_14_grave.txt
  - newMeat/1_15_cactus_jumper.txt
max_steps: 4000
time_limit_seconds: 60
