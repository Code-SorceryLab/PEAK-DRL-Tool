stats_class: code.stats.MarioStats.MarioStats

tracks:
  - target: code.games.modules.Objects.Player.Player.set_horizontal_velocity
    recorder: record_horizontal_velocity
    args: [vx]

  - target: code.games.platformer_core.PlatformerCore._handle_death
    recorder: record_death
    args: [cause]

  - target: code.games.modules.Objects.Player.Player.start_jump
    recorder: record_jump
    args: []

  - target: code.games.modules.System.PhysicsManager.PhysicsManager._handle_player_kill_enemy
    recorder: record_enemies_killed
    args: []

  - target: code.games.modules.System.PhysicsManager.PhysicsManager._collect_coin
    recorder: record_coins_collected
    args: []

  - target: code.games.platformer_core.PlatformerCore._set_max_x_seen
    recorder: record_max_x_seen
    args: [value]

  - target: code.games.modules.Objects.Player.Player._update_position
    recorder: record_position_update
    args: [posX, posY]

resets:
  - target: code.games.platformer_core.PlatformerCore.complete_level
  - target: code.games.platformer_core.PlatformerCore._handle_death
