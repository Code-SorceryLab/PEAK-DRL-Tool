path: code/stats/results/

metrics:
  B1_challenge_calibration:
    thresholds:
      target_completion_rate: 0.7
      warning_completion_rate_difference: 0.2
      target_mean_completion_time: 20
      warning_mean_completion_time_difference: 4

  B2_punishment_severity:
    thresholds:
      target_deaths_per_run: 2
      warning_deaths_per_run: 1
      target_death_cluster_entropy: 0.4
      warning_death_cluster_entropy: 0.1

  B3_strategy_diversity:
    thresholds:
      target_strategy_count: 2
      warning_strategy_count: 1
      target_dominant_path_share: 0.5
      warning_dominant_path_share: 0.1
      target_safe_vs_fast_ratio: 1.3
      warning_safe_vs_fast_ratio: 0.3
      route_cluster_threshold: 96

  M4_risk_reward:
    personas:
      collector: coin_collector
      baseline: adept
    thresholds:
      target_time_cost: 1.3
      warning_time_cost: 0.2
      target_death_premium: 1.5
      warning_death_premium: 0.3

  M5_skill_expression:
    skills:
      expert: expert
      mid: mid
      novice: novice
    thresholds:
      target_novice_expert_gap: 0.4
      warning_novice_expert_gap: 0.15
      target_mid_expert_gap: 0.15
      warning_mid_expert_gap: 0.1

  M6_progression_fit:
    skills:
      novice: novice
      mid: mid
      expert: expert
    thresholds:
      target_novice_completion: 0.4
      warning_novice_completion: 0.15
      target_mid_completion: 0.65
      warning_mid_completion: 0.15
      target_expert_completion: 0.85
      warning_expert_completion: 0.1
