name: rppo
policy: MlpLstmPolicy

# Standard PPO hyperparameters
verbose: 1
n_steps: 2048
batch_size: 64
n_epochs: 8
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
ent_coef: 0.015
vf_coef: 0.5
max_grad_norm: 0.5
learning_rate: 0.00015

# LSTM-specific parameters (nested under policy_kwargs)
policy_kwargs:
  enable_critic_lstm: true
  lstm_hidden_size: 256
  n_lstm_layers: 1
