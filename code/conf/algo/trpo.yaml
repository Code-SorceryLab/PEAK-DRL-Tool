name: TRPO
policy: MlpPolicy

# Training parameters
n_steps: 2048                # Steps per rollout
batch_size: 256              # Larger batch for better gradient estimates
learning_rate: 3e-4          # Reduced learning rate for stability
gamma: 0.99                  # Standard discount factor
gae_lambda: 0.95             # GAE parameter
verbose: 1

# Critic updates
n_critic_updates: 10         # Number of critic updates per rollout

# Conjugate Gradient parameters
cg_max_steps: 20             # More CG iterations for better approximation
cg_damping: 0.1              # Damping for CG stability

# Line search parameters for trust region
line_search_shrinking_factor: 0.8
line_search_max_iter: 10

# Trust region constraint
target_kl: 0.005             # Lower target KL to be more conservative (default is 0.01)

# Sub-sampling factor (usually 1)
sub_sampling_factor: 1

# Policy network architecture (passed via policy_kwargs if supported)
policy_kwargs:
  net_arch: 
    - 256
    - 256
  activation_fn: ReLU # Use ReLU activations for better learning
