_target_: algos.get_algo
name: ppo               # looked up inside get_algo → PPO class
policy: MultiInputPolicy

# --- Exploration & Memory Settings ---
n_steps: 4096
ent_coef: 0.02

# --- Standard PPO Settings ---
batch_size: 512
n_epochs: 6
learning_rate: 0.0003
gae_lambda: 0.95
gamma: 0.99
clip_range: 0.2
verbose: 1

policy_kwargs:
  optimizer_kwargs:
    weight_decay: 1e-8


device: cpu      # cpu / cuda