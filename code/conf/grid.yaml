defaults:
  - callback: none
  - _self_

# lists of experiment dimensions
games: [platformer, megaman, sonic, meatboy]   # other games that are setup [ platformer, shooter ]  # must match files in conf/game/*.yaml
models: [ppo]  #other models that are setup [ rppo, trpo, a2c ]  # must match files in conf/algo/*.yaml
architectures: [lightmobile, spatialattention, channelattention, deepchannelattention]
personas: [
  platformer_simple,
  platformer_adept,
  megaman_simple,
  megaman_adept,
  sonic_simple,
  meatboy_simple,
  #sonic_speedrunner,
  #platformer_enemy_hunter,
  #platformer_speedrunner,
  #platformer_completionist,
]

# skill -> training steps
skills:
  Novice: 1_000_000
  Expert: 8_000_000

# generic env params
seed: 1234
render_mode: none        # none / human
fps: 60
max_steps: 10000

tb_root: mylogs     # folder where TensorBoard logs go (tensorboard --logdir runs)
eval_freq: 10000  # evaluate every N steps (EvalCallback)
save_freq: 20000  # save model every N steps (CheckpointCallback)

device: cpu      # auto | cpu | cuda | mps  (cpu is fastest on this Mac; mps crashes SpatialAttention)
n_envs: 12        # 8-16 parallel SubprocVecEnv workers (Phase-1). CPU device: workers share cores with the learner.
profile: true    # true → enable ProfilingCallback (TB scalars + profiling_log.csv)
compile: false   # true → torch.compile(model.policy) (warm-up cost first rollout; 20-40% train speedup after)


# null values mean "no override"
model: null     # optional single selection
persona: null   # optional single selection
skill: null     # optional single selection2

viz_enabled: false
viz_freq: 10000        # adjust to taste — every 50k steps is reasonable
viz_preview_episodes: 1
viz_fps: 30
