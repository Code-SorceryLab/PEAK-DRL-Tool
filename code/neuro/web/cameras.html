<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEAK Replay Wall</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23000000'/><path d='M3 12 L8 4 L13 12' stroke='%23f83800' stroke-width='2' fill='none'/></svg>">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="theme.css">
<!-- theme.css styles the page (night tile grid, type, frames, .btn, .label); this only fits Tailwind to it -->
<style type="text/tailwindcss">
  @layer base {
    html, body { @apply h-full; }
    h2 { font-size: 16px; font-weight: 700; }   /* theme.css gives headings the pixel face; Tailwind's reset drops its size */
  }
  @layer components {
    .eyebrow { font: 600 12.5px/1.3 var(--ui); color: var(--dim); text-transform: capitalize; }   /* the persona column heads */
    .tab { white-space: nowrap; padding: 10px 12px 7px; font: 600 13px/1.2 var(--ui); color: var(--mute); border-bottom: 3px solid transparent; }
    .tab:hover { color: var(--ink); }
    .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--peak); }
    .cam {
      position: relative; display: flex; flex-direction: column; min-width: 0; overflow: hidden; text-align: left;
      border: 3px solid transparent; border-image: var(--frame) 1 / 3px stretch; background: var(--deck); background-clip: padding-box;
    }
    .cam:hover, .cam.rec { border-image-source: var(--frame-hi); }   /* rec: the view open in the large window */
    .cam canvas { @apply w-full h-auto block bg-black; }
    .cam .strip { @apply h-[3px] w-full; }
    .cam .meta { @apply flex items-center justify-between gap-2 px-2 py-1 whitespace-nowrap overflow-hidden; font: 500 12px/1.3 var(--dense); color: var(--dim); }
    .cam .flash { @apply absolute inset-x-0 top-1/3 mx-auto w-fit px-2 py-0.5 bg-black/80 hidden; font: 600 13px/1.2 var(--ui); text-transform: lowercase; }
    .cam.empty { @apply opacity-40 cursor-default; }
    .cam.empty:hover { border-image-source: var(--frame); }
  }
  /* the script tints a flash inline with Tailwind's old sky (won) or red (any other end): show them as the theme's */
  #wall > div:not(.eyebrow) { font: 700 14px/1.2 var(--pixel); color: var(--ink); }   /* the game names down the side */
  #sensors > div:not(.flex) { font: 600 12.5px/1.3 var(--ui); color: var(--dim); }
  #sensors abbr, #sensors output { font-size: 12px; }
  #sensors .bg-zinc-900 { background-color: var(--deck-2); }   /* the script's tracks are the panel colour now: raise them */
  #conn::first-letter { text-transform: uppercase; }
  #dot.bg-red-500 { background-color: var(--run); }   /* live reads green, as on the training dashboard */
  #bigcv { background-color: #000; }
  body.offline #wall { filter: grayscale(1) brightness(.6); }
  dialog::backdrop { background: rgba(0, 0, 0, .85); }
  .cam .score:not(:empty)::before, #bigscore:not(:empty)::before {   /* wins: a coin */
    content: ""; display: inline-block; height: 12px; aspect-ratio: 1; margin-right: 4px; vertical-align: -2px;
    background: var(--i-coin) center / contain no-repeat; image-rendering: pixelated; }
</style>
<script>
  // Tailwind's colour names, the theme's black and red (same map as index.html), so the classes the script and the
  // server's sensor layouts write keep working. Case, tracking, corners and the live pulse belong to the theme.
  tailwind.config = {
    corePlugins: { textTransform: false, letterSpacing: false, borderRadius: false, animation: false },
    theme: { extend: {
      colors: {
        zinc: { 100: "#f8f8f8", 200: "#ececec", 300: "#d8d8d8", 400: "#bcbcbc", 500: "#7c7c7c",
                600: "#4a4a4a", 700: "#2e2e2e", 800: "#1c1c1c", 900: "#0e0e0e", 950: "#000000" },
        red: { 400: "#f87858", 500: "#f83800", 600: "#d82800", 900: "#3a0c06", 950: "#3a0c06" },
        orange: { 400: "#e40058" },
        amber: { 300: "#fce0a8", 400: "#fca044" },
        emerald: { 400: "#58d854" },
        sky: { 400: "#f8d878" },
      },
      fontFamily: {
        sans: ["Barlow", "system-ui", "Segoe UI", "sans-serif"],
        mono: ["Barlow Semi Condensed", "Barlow", "system-ui", "sans-serif"],
      },
    } },
  };
</script>
</head>
<body class="flex flex-col">

<header class="flex flex-wrap items-center gap-x-6 px-5 border-b-2 border-zinc-700 bg-zinc-950 sticky top-0 z-20">
  <div class="flex items-center gap-3 py-2.5">
    <span class="wordmark">PEAK</span>
    <span class="label">Replay wall</span>
  </div>
  <nav class="flex self-stretch items-end" role="tablist" aria-label="Pages">
    <button class="tab" role="tab" aria-selected="true" data-src="">Cameras</button>
    <button class="tab" role="tab" aria-selected="false" data-src="/balance/report.html">Balance report</button>
    <button class="tab" role="tab" aria-selected="false" data-src="/balance/ablation.html">Sensor ablation</button>
    <button class="tab" role="tab" aria-selected="false" data-src="/balance/gasweep.html">GA sweep</button>
  </nav>
  <div class="ml-auto flex items-center gap-2 text-[12.5px] font-semibold text-zinc-400" aria-live="polite">
    <span id="dot" class="w-2 h-2 bg-zinc-600"></span><span id="conn">connecting</span>
  </div>
</header>

<main id="wallpage" class="flex-1 overflow-auto px-5 py-4">
  <div id="wall" class="grid gap-3" style="grid-template-columns: 90px repeat(6, minmax(0, 1fr))"></div>
  <p class="mt-4 max-w-[80ch] text-[13.5px] text-zinc-400">Each view replays the saved models of one game and persona, level after level, with the best of three seeds per level. Click a view to watch it with its rays; Esc or a click outside closes it.</p>
</main>
<iframe id="frame" title="Balance pages" class="flex-1 w-full border-0 hidden bg-zinc-950"></iframe>

<dialog id="big" class="frame text-zinc-100 p-0 max-w-[96vw] max-h-[94vh] w-[1200px]" aria-labelledby="bigtitle">
  <div class="flex items-center gap-3 px-4 py-2 border-b-2 border-zinc-700">
    <span id="bigchip" class="w-2.5 h-2.5"></span>
    <h2 id="bigtitle"></h2>
    <span id="biglevel" class="font-mono text-[13px] text-zinc-400"></span>
    <span id="bigscore" class="font-mono text-[13px] text-zinc-400"></span>
    <button id="bigclose" class="btn ml-auto" aria-label="Close">✕</button>
  </div>
  <div class="flex gap-4 p-4 items-start">
    <div class="flex-1 min-w-0 flex justify-center"><canvas id="bigcv" width="800" height="600" class="frame max-w-full max-h-[80vh] w-auto h-auto"></canvas></div>
    <aside class="w-56 shrink-0 max-h-[80vh] overflow-auto">
      <div class="label mb-2">Sensors</div>
      <div id="sensors" class="flex flex-col gap-1.5"></div>
    </aside>
  </div>
</dialog>

<script>
"use strict";
const GAME_NAMES = {mario:"Mario", meatboy:"Meat Boy", bomberman:"Bomberman", megaman:"Mega Man"};
const ORDER = ["novice","clumsy","experienced","speedrunner","killer","collector"];   // = cameras.py ORDER
const RAY_COLORS = {0:"rgba(255,255,255,.10)", 1:"#ef4444", 2:"#ec4899"};
const TILE_STYLES = {1:{fill:"rgba(239,68,68,.15)", line:"#ef4444"}, 2:{fill:"rgba(248,216,120,.15)", line:"rgba(248,216,120,.5)"}};
const SENSORS = [   // the platformers' 14-slot ray vector (same layout as the trainer dashboard)
  {g:"Proximity rays", color:"bg-zinc-300", rows:[
    {i:0,l:"FWD",d:"Ray straight ahead"},{i:1,l:"U30",d:"Ray 30° up"},{i:2,l:"U60",d:"Ray 60° up"},
    {i:3,l:"D30",d:"Ray 30° down"},{i:4,l:"D60",d:"Ray 60° down"},{i:5,l:"BCK",d:"Ray straight back"}]},
  {g:"Threats", color:"bg-red-500", rows:[{i:6,l:"NMY",d:"Enemy ahead"},{i:7,l:"PIT",d:"Gap in the floor ahead"}]},
  {g:"Kinematics", color:"bg-sky-400", rows:[{i:9,l:"VX",center:true,d:"Horizontal velocity"},
    {i:10,l:"VY",center:true,d:"Vertical velocity"},{i:8,l:"GND",d:"On the ground"},{i:11,l:"JMP",d:"Jump held"}]},
  {g:"Objectives", color:"bg-amber-400", rows:[{i:12,l:"BLK",d:"Question blocks ahead"}]},
];
const INVERT = new Set([0,1,2,3,4,5,6]);
const $ = id => document.getElementById(id);
let ws, colors = {}, cams = {}, watching = -1, paused = false, senseKey = "", senseEls = [];
const lvlName = l => /^\d+$/.test(l) ? `Level ${+l + 1}` : l;   // meatboy / bomberman levels are indices
const send = o => { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); };

// ── the wall ──
function buildWall(list){
  const wall = $("wall"); wall.innerHTML = ""; cams = {};
  wall.appendChild(document.createElement("div"));
  for (const p of ORDER){
    const h = document.createElement("div");
    h.className = "flex items-center gap-1.5 eyebrow min-w-0 overflow-hidden whitespace-nowrap";
    h.innerHTML = `<i class="w-2 h-2 rounded-full" style="background:${colors[p]}"></i>${p}`;
    wall.appendChild(h);
  }
  let game = null;
  for (const c of list){
    if (c.game !== game){
      game = c.game;
      const g = document.createElement("div");
      g.className = "self-center font-semibold text-zinc-200 text-sm";
      g.textContent = GAME_NAMES[game] || game;
      wall.appendChild(g);
    }
    const b = document.createElement("button");
    b.className = "cam" + (c.levels.length ? "" : " empty");
    if (c.game === "megaman") b.style.gridColumn = "span 2";
    const col = colors[c.persona] || "#71717a";
    b.innerHTML = `<i class="strip" style="background:${col}"></i><canvas width="280" height="210"></canvas>
      <span class="flash"></span>
      <span class="meta"><span class="lvl truncate">${c.levels.length ? lvlName(c.levels[0]) : "no model"}</span><span class="score tabular-nums"></span></span>`;
    b.setAttribute("aria-label", `${GAME_NAMES[c.game]} · ${c.persona}`);
    if (c.levels.length) b.onclick = () => openCam(c.id);
    else b.disabled = true;
    wall.appendChild(b);
    cams[c.id] = {...c, el:b, cv:b.querySelector("canvas"), lvl:b.querySelector(".lvl"),
                  score:b.querySelector(".score"), flash:b.querySelector(".flash")};
  }
}

function drawImg(cv, src, then){
  const img = new Image();
  img.onload = () => {
    if (cv.width !== img.width || cv.height !== img.height){ cv.width = img.width; cv.height = img.height; }
    const ctx = cv.getContext("2d"); ctx.imageSmoothingEnabled = false;
    ctx.drawImage(img, 0, 0);
    if (then) then(ctx);
  };
  img.src = "data:image/jpeg;base64," + src;
}

function onFrame(f){
  const c = cams[f.id]; if (!c) return;
  if (f.rays){                                   // the watched camera at full size
    if (f.id !== watching) return;
    drawImg($("bigcv"), f.jpg, ctx => drawOverlay(ctx, f.rays, f.tiles));
    $("biglevel").textContent = lvlName(f.level);
    $("bigscore").textContent = `won ${f.wins} of ${f.attempts}`;
    updateSensors(f);
    return;
  }
  drawImg(c.cv, f.jpg);
  c.lvl.textContent = lvlName(f.level);
  c.score.textContent = f.attempts ? `${f.wins}/${f.attempts}` : "";
  c.flash.textContent = f.status;
  c.flash.style.display = f.status ? "block" : "none";
  c.flash.style.color = f.status === "WON" ? "#f8d878" : "#e40058";
}

function drawOverlay(ctx, rays, tiles){
  for (const [tx,ty,ts,kind] of (tiles || [])){
    const st = TILE_STYLES[kind]; if (!st) continue;
    ctx.fillStyle = st.fill; ctx.strokeStyle = st.line; ctx.lineWidth = kind === 1 ? 2 : 1;
    ctx.fillRect(tx, ty, ts, ts); ctx.strokeRect(tx, ty, ts, ts);
  }
  for (const [x1,y1,x2,y2,hit] of (rays || [])){
    ctx.strokeStyle = RAY_COLORS[hit] || RAY_COLORS[0]; ctx.lineWidth = hit ? 2 : 1;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
    if (hit){ ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(x2,y2,2.5,0,7); ctx.fill(); }
  }
}

// ── the large view ──
function openCam(id){
  const c = cams[id]; watching = id;
  $("bigtitle").textContent = `${GAME_NAMES[c.game]} · ${c.persona}`;
  $("bigchip").style.background = colors[c.persona] || "#71717a";
  $("biglevel").textContent = ""; $("bigscore").textContent = "";
  $("bigcv").getContext("2d").clearRect(0, 0, $("bigcv").width, $("bigcv").height);
  senseKey = null;
  send({cmd:"watch", id});
  c.el.classList.add("rec");
  $("big").showModal();
}
function closeCam(){ if ($("big").open) $("big").close(); }
$("big").addEventListener("close", () => {
  if (cams[watching]) cams[watching].el.classList.remove("rec");
  watching = -1; send({cmd:"close"});
});
$("big").addEventListener("click", e => { if (e.target === $("big")) closeCam(); });   // a click on the backdrop
$("bigclose").onclick = closeCam;

function buildSensors(groups){
  const root = $("sensors"); root.innerHTML = ""; senseEls = [];
  for (const grp of groups){
    const h = document.createElement("div");
    h.className = "text-[10px] font-bold tracking-widest uppercase text-zinc-500 mt-2 first:mt-0";
    h.textContent = grp.g; root.appendChild(h);
    for (const r of grp.rows){
      const row = document.createElement("div");
      row.className = "flex items-center gap-2";
      row.innerHTML = `<abbr title="${r.d}" class="w-9 text-right font-mono text-[10px] font-bold text-zinc-400 no-underline">${r.l}</abbr>
        <div class="relative h-1 flex-1 bg-zinc-900 rounded-full overflow-hidden">${r.center ? '<div class="absolute left-1/2 inset-y-0 w-px bg-white/20"></div>' : ""}
        <i class="absolute inset-y-0 left-0 rounded-full ${grp.color}"></i></div>
        <output class="w-9 font-mono text-[10px] text-zinc-400 tabular-nums">–</output>`;
      root.appendChild(row);
      senseEls.push({idx:r.i, bar:row.querySelector("i"), out:row.querySelector("output"), center:!!r.center,
                     inv: r.inv !== undefined ? !!r.inv : INVERT.has(r.i)});
    }
  }
}
function updateSensors(f){
  const key = JSON.stringify(f.sensor_labels || null);
  if (key !== senseKey){ senseKey = key; buildSensors(f.sensor_labels || SENSORS); }
  for (const s of senseEls){
    let v = f.sensors[s.idx]; if (v === undefined) continue;
    const shown = v; if (s.inv) v = 1 - v;
    if (s.center){ const half = Math.min(Math.abs(v),1) * 50; s.bar.style.left = v < 0 ? (50-half)+"%" : "50%"; s.bar.style.width = half+"%"; }
    else { s.bar.style.left = "0%"; s.bar.style.width = Math.max(0, Math.min(v,1))*100 + "%"; }
    s.out.value = (+shown).toFixed(2);
  }
}

// ── tabs: the balance pages load in a frame under the tab bar; the wall stops sending meanwhile ──
function setPaused(on){ paused = on; send({cmd:"pause", on}); }
for (const t of document.querySelectorAll(".tab")){
  t.onclick = () => {
    document.querySelectorAll(".tab").forEach(x => x.setAttribute("aria-selected", x === t));
    const src = t.dataset.src;
    $("wallpage").classList.toggle("hidden", !!src);
    $("frame").classList.toggle("hidden", !src);
    if (src && $("frame").getAttribute("src") !== src) $("frame").src = src;
    setPaused(!!src || document.hidden);
  };
}
document.addEventListener("visibilitychange", () => setPaused(document.hidden || !$("frame").classList.contains("hidden")));

// ── connection ──
function setConn(state){
  $("conn").textContent = state;
  $("dot").className = "w-2 h-2 rounded-full " + (state === "live" ? "bg-red-500 animate-pulse" : "bg-zinc-600");
  document.body.classList.toggle("offline", state !== "live");
}
function connect(){
  ws = new WebSocket(`ws://${location.hostname || "127.0.0.1"}:${(+location.port || 8010) + 765}`);
  ws.onopen = () => { setConn("live"); if (paused) send({cmd:"pause", on:true}); if (watching >= 0) send({cmd:"watch", id:watching}); };
  ws.onclose = () => { setConn("offline"); setTimeout(connect, 2000); };
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    if (m.type === "layout"){ colors = m.colors; if (!Object.keys(cams).length) buildWall(m.cams); }
    else if (m.type === "frames") m.frames.forEach(onFrame);
  };
}
connect();
</script>
</body>
</html>
