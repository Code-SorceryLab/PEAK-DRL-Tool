<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" font-family="Consolas, 'JetBrains Mono', monospace">
  <defs>
    <linearGradient id="fitfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="210" rx="14" fill="#09090b"/>
  <rect x="0.5" y="0.5" width="899" height="209" rx="14" fill="none" stroke="#27272a"/>

  <!-- grid -->
  <g stroke="#18181b" stroke-width="1">
    <line x1="40" y1="60" x2="860" y2="60"/>
    <line x1="40" y1="100" x2="860" y2="100"/>
    <line x1="40" y1="140" x2="860" y2="140"/>
    <line x1="40" y1="180" x2="860" y2="180"/>
  </g>

  <!-- fitness curve drawing itself, forever -->
  <path id="fit" d="M 60 180 L 140 176 L 220 168 L 300 172 L 380 150 L 460 142 L 540 118 L 620 122 L 700 92 L 780 78 L 840 64"
        fill="none" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"
        stroke-dasharray="820" stroke-dashoffset="820">
    <animate attributeName="stroke-dashoffset" values="820;0;0" keyTimes="0;0.7;1" dur="7s" repeatCount="indefinite"/>
  </path>
  <path d="M 60 180 L 140 176 L 220 168 L 300 172 L 380 150 L 460 142 L 540 118 L 620 122 L 700 92 L 780 78 L 840 64 L 840 180 L 60 180 Z"
        fill="url(#fitfill)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.55;0.75;1" dur="7s" repeatCount="indefinite"/>
  </path>

  <!-- the specimen: a dot running the curve, casting rays -->
  <g>
    <animateMotion dur="7s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;0.7;1" calcMode="linear"
      path="M 60 180 L 140 176 L 220 168 L 300 172 L 380 150 L 460 142 L 540 118 L 620 122 L 700 92 L 780 78 L 840 64"/>
    <g stroke="#ef4444" stroke-width="1.2" opacity="0.75">
      <line x1="0" y1="0" x2="46" y2="0">
        <animate attributeName="opacity" values="1;.25;1" dur="0.9s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="0" x2="40" y2="-20">
        <animate attributeName="opacity" values=".25;1;.25" dur="0.9s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="0" x2="40" y2="20">
        <animate attributeName="opacity" values=".6;.2;.6" dur="1.1s" repeatCount="indefinite"/>
      </line>
      <line x1="0" y1="0" x2="24" y2="-34">
        <animate attributeName="opacity" values=".2;.8;.2" dur="1.3s" repeatCount="indefinite"/>
      </line>
    </g>
    <circle cx="46" cy="0" r="2.4" fill="#ffffff" opacity="0.9">
      <animate attributeName="opacity" values=".9;.3;.9" dur="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle r="5.5" fill="#ef4444"/>
    <circle r="5.5" fill="none" stroke="#ef4444" stroke-width="1.5" opacity="0.5">
      <animate attributeName="r" values="5.5;12;5.5" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".5;0;.5" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- wordmark -->
  <text x="60" y="52" font-size="34" font-weight="bold" fill="#fafafa" letter-spacing="2">PEAK
    <tspan fill="#ef4444">ENGINE</tspan></text>
  <text x="60" y="76" font-size="12" fill="#71717a" letter-spacing="4">NEUROEVOLUTION · GAME BALANCE · 291 PARAMS · NO GPU</text>

  <!-- generation ticker -->
  <g font-size="12" fill="#52525b" text-anchor="end">
    <text x="840" y="200">gen 1
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.68;0.72;1" dur="7s" repeatCount="indefinite"/>
    </text>
    <text x="840" y="200" fill="#ef4444" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.68;0.72;1" dur="7s" repeatCount="indefinite"/>
      gen 42 · WON
    </text>
  </g>
  <text x="60" y="200" font-size="12" fill="#52525b">fitness</text>
</svg>
